<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
  <title id="title">Where each patched value lands</title>
  <desc id="desc">A table of every value the patcher randomises, how many options its pool has, and every file that must receive the same new value so runtime checks still match.</desc>
  <rect width="1080" height="610" rx="18" fill="#10151e"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#f2f7fb">
    <text x="40" y="49" font-size="25" font-weight="700">Each rename has to land everywhere it's read</text>
    <text x="40" y="80" font-size="17" fill="#b5c3d1">Miss one copy and a loader or integrity check fails at startup, the cause of most v1.0.x fixes</text>
    <g fill="#1d2b38"><rect x="40" y="148" width="1000" height="42" rx="6"/><rect x="40" y="232" width="1000" height="42" rx="6"/><rect x="40" y="316" width="1000" height="42" rx="6"/><rect x="40" y="400" width="1000" height="42" rx="6"/><rect x="40" y="484" width="1000" height="42" rx="6"/></g>
    <g font-size="14" font-weight="700" fill="#61e9b6" letter-spacing=".6"><text x="58" y="132">VALUE</text><text x="320" y="132">OPTIONS</text><text x="430" y="132">WRITTEN TO</text></g>
    <g font-size="17" font-weight="600">
      <text x="58" y="175">memfd name</text>
      <text x="58" y="217">Shell namespace variable</text>
      <text x="58" y="259">Loader scope env var</text>
      <text x="58" y="301">Loader context-fd env var</text>
      <text x="58" y="343">Loader adapter tag</text>
      <text x="58" y="385">Thread names (×3)</text>
      <text x="58" y="427">Agent folder + filename</text>
      <text x="58" y="469">Application ID (opt-in)</text>
      <text x="58" y="511">Library SHA-256 (×2)</text>
    </g>
    <g font-size="16" fill="#b5c3d1">
      <text x="320" y="175">10</text><text x="320" y="217">8</text><text x="320" y="259">10</text><text x="320" y="301">10</text><text x="320" y="343">10</text>
      <text x="320" y="385">10 each</text><text x="320" y="427">10 × 10</text><text x="320" y="469">10</text><text x="320" y="511" fill="#f0b35a">computed</text>
    </g>
    <g font-size="16" font-family="Consolas, Menlo, monospace" fill="#d6e0ea">
      <text x="430" y="175">librootcatch-inject.so · libsilph-spawn.so · loader-policy.c</text>
      <text x="430" y="217">ConnectionStrategy.java</text>
      <text x="430" y="259">loader-adapter.c · spawn-guard.sh</text>
      <text x="430" y="301">loader-adapter.c · spawn-guard.sh</text>
      <text x="430" y="343">loader-adapter.c · LoaderState.java</text>
      <text x="430" y="385">NativeEngineRunner.java · FarmService.java</text>
      <text x="430" y="427">NativeEngineRunner.java · build.cjs · assets/</text>
      <text x="430" y="469">build.gradle.kts</text>
      <text x="430" y="511">build.gradle.kts · ConnectionStrategy enum</text>
    </g>
    <text x="40" y="566" font-size="15" fill="#b5c3d1">Since v1.0.6 the rest of the app reads the agent path from <tspan fill="#61e9b6" font-family="Consolas, Menlo, monospace">AgentBuild.PATH</tspan>, which build.cjs writes, so renames can't break it.</text>
    <text x="40" y="590" font-size="15" fill="#b5c3d1">Settings file <tspan font-family="Consolas, Menlo, monospace">app_config.xml</tspan> is never renamed, so settings survive rebuilds.</text>
  </g>
</svg>
